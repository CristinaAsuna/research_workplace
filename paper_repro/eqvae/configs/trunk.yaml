# 当前主干的完整配置。只有"主干迁移"才能改这个文件（见 AGENTS.md §7）。
# 实验写成 configs/exp/<实验 id>.yaml，只列相对本文件的差异。
# 主干 = 原版 SD-VAE（kl-f8）+ 官方评测协议；微调段只在 eqvae.train 中使用。

vae: sd-vae                # 别名，见 eqvae.models.resolve_vae

eval:
  n: 50000
  seed: 0
  size: 256
  batch_size: 16
  rot_k: [1, 2, 3]         # R(θ)：θ = π/2, π, 3π/2
  scales: [0.25, 0.5, 0.75]  # S(s)

train:
  init: sd-vae
  steps: 8007              # 1 epoch ImageNet train，等效 batch 160
  micro_batch: 20
  grad_accum: 8            # 20 × 8 = 160，按集群实测调整，乘积保持 160
  base_lr: 4.5e-6          # 官方：lr = base_lr × 等效 batch = 7.2e-4
  betas: [0.5, 0.9]
  kl_weight: 1.0e-6
  disc_weight: 0.5
  disc_start: 0
  perceptual_weight: 1.0
  p_eq: 0.5                # 走等变分支的概率（论文 p_α=0.5）
  p_prior_s: 0.25          # 先验分支里在低分辨率重建的概率（官方 config）
  scale_choices_32: [8, 31]  # s ∈ {8/32, …, 31/32}
  rot_choices: [1, 2, 3]
  num_workers: 16
  log_every: 50
  save_every: 1000
  bf16: true
  seed: 0
